name: Security

# Scanning de segurança, todo dia: auditoria das dependências de produção
# (pnpm audit), Trivy nas imagens que estão rodando no cluster, checagem do
# runtime do Node contra os security releases do nodejs.org e análise estática
# (CodeQL). Havendo pendência com correção disponível, o detalhe vai para uma
# tarefa do Hub (Infraestrutura) e um resumo curto com o link dela vai para o
# WhatsApp pelo mesmo webhook do changelog do deploy; dia limpo não envia.
on:
  workflow_dispatch:
  schedule:
    # Todo dia às 09:00 UTC (06:00 em Brasília).
    - cron: '0 9 * * *'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/hcode
  K8S_CLUSTER_ID: 05c7d4fa-4bc2-4dbf-80b6-757ecec43bff
  TRIVY_VERSION: 0.76.0
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  dependency-audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit (produção, high/critical)
        # O resultado vai para o relatório do job notify; o pnpm audit sai com
        # código != 0 sempre que acha algo, o que não é falha deste job.
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
          jq -e '.metadata.vulnerabilities' audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit
          path: audit.json

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        run: |
          set -eu
          DOCTL_VERSION="1.119.1"
          curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/doctl.tar.gz
          tar -xzf /tmp/doctl.tar.gz -C /tmp
          sudo mv /tmp/doctl /usr/local/bin/doctl
      - name: Authenticate doctl
        run: doctl auth init -t '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}'
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.K8S_CLUSTER_ID }}
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install Trivy
        # Binário fixo com checksum conferido, em vez da action de terceiros.
        run: |
          set -eu
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan running images
        # As imagens que estão de fato rodando: é o que está exposto agora,
        # independente do que já mudou no master. Entram também as de terceiros
        # (postgres, n8n, ingress-nginx...), que não passam pelo nosso build; só
        # o kube-system fica de fora, porque é a DigitalOcean que o atualiza.
        run: |
          set -eu
          mkdir -p trivy
          kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' \
            | awk -F'\t' '$1 != "kube-system" { n = split($2, a, " "); for (i = 1; i <= n; i++) print a[i] }' \
            | sort -u > images.txt
          echo "Imagens em execução:"; cat images.txt
          FAILED=0
          while read -r IMAGE; do
            # Do nosso registry o nome basta (a tag é o SHA do commit); de
            # terceiros a tag entra no nome, senão postgres:15 e postgres:18
            # gravariam o mesmo arquivo.
            case "$IMAGE" in
              "${REGISTRY}/"*) NAME=$(echo "$IMAGE" | sed -E 's#.*/##; s#[:@].*##') ;;
              *) NAME=$(echo "$IMAGE" | sed -E 's#^(docker\.io|registry-1\.docker\.io|ghcr\.io|quay\.io|registry\.k8s\.io)/##; s#^library/##; s#@.*##; s#[/:]#-#g') ;;
            esac
            [ -f "trivy/${NAME}.json" ] && continue
            # Uma segunda tentativa, com o cache limpo: a leitura de camada às
            # vezes chega truncada (`unexpected EOF`) e derrubava o scan inteiro.
            OK=0
            for ATTEMPT in 1 2; do
              if trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
                --format json --output "trivy/${NAME}.json" "$IMAGE"; then
                OK=1
                break
              fi
              trivy clean --scan-cache
            done
            if [ "$OK" -ne 1 ]; then
              rm -f "trivy/${NAME}.json"
              echo "::warning::Falha ao escanear ${IMAGE}"
              FAILED=1
            fi
            # A imagem da api passa de 1 GB: limpa o cache de camadas entre uma e outra.
            trivy clean --scan-cache
          done < images.txt
          exit $FAILED

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: trivy/
          if-no-files-found: warn

  notify:
    name: Notify (WhatsApp)
    needs: [dependency-audit, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Build report
        env:
          AUDIT_JSON: reports/pnpm-audit/audit.json
          TRIVY_DIR: reports/trivy
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SCAN_RESULT: ${{ needs.image-scan.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Token da API do Hub: abre/atualiza a tarefa de correção (Infraestrutura).
          HUB_API_TOKEN: ${{ secrets.HUB_API_TOKEN }}
        run: node .github/scripts/security-report.mjs report

      - name: Send WhatsApp notification
        env:
          HUB_WEBHOOK_TOKEN: ${{ secrets.HUB_WEBHOOK_TOKEN }}
        run: |
          PART_NUM=0
          for PART_FILE in $(ls report/part-*.txt 2>/dev/null | sort -V); do
            PART_NUM=$((PART_NUM + 1))
            HTTP_STATUS=$(jq -n --rawfile msg "$PART_FILE" '{"message": $msg}' | \
              curl -s -o /tmp/notify_response.txt -w "%{http_code}" \
                -X POST "https://hub-api.hcode.com.br/webhook/987cbf77-3800-47c3-80c4-ec44a305e84c" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $HUB_WEBHOOK_TOKEN" \
                -d @-)
            echo "Parte ${PART_NUM}: HTTP $HTTP_STATUS"
            cat /tmp/notify_response.txt || true
            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "::warning::Parte ${PART_NUM} retornou HTTP $HTTP_STATUS"
            fi
          done
          if [ "$PART_NUM" -eq 0 ]; then
            echo "Sem pendências — nenhuma mensagem enviada."
          fi

  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
          upload: never

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
